name: Twitter/X Video Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Twitter/X status URL (e.g., https://twitter.com/user/status/123456789)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download video from Twitter
        run: |
          yt-dlp -f best --output "downloads/%(title)s.%(ext)s" "${{ github.event.inputs.url }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twitter-video
          path: downloads/
