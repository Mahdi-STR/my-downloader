name: YouTube via API

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Get download URL from API
        id: api
        run: |
          VIDEO_URL="${{ github.event.inputs.url }}"
          API_URL="https://ytdlapi.com/api/convert?url=${VIDEO_URL}&format=mp4"
          RESPONSE=$(curl -s "$API_URL")
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.dlink')
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

      - name: Download video
        run: |
          curl -L -o video.mp4 "${{ steps.api.outputs.download_url }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
