name: YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
        type: string
      quality:
        description: 'Quality'
        required: false
        default: '720'
        type: choice
        options:
          - best
          - 720
          - 480
          - 360

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          pip install yt-dlp

      - name: Download video
        run: |
          if [ "${{ github.event.inputs.quality }}" = "best" ]; then
            FORMAT="-f best"
          elif [ "${{ github.event.inputs.quality }}" = "720" ]; then
            FORMAT="-f 'best[height<=720]'"
          elif [ "${{ github.event.inputs.quality }}" = "480" ]; then
            FORMAT="-f 'best[height<=480]'"
          elif [ "${{ github.event.inputs.quality }}" = "360" ]; then
            FORMAT="-f 'best[height<=360]'"
          fi
          
          echo "Using format: $FORMAT"
          yt-dlp $FORMAT --output "downloads/%(title)s.%(ext)s" "${{ github.event.inputs.url }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
